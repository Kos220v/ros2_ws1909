# ROS 2 Jazzy. Vector order documented in docs/GPS_NAVIGATION_RU.md
ekf_local:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.3
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
